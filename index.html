<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title Animation</title>
  <link rel="stylesheet" href="https://use.typekit.net/hvi2thr.css">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: "greycliff-cf", sans-serif;
    }

    .scroll-container {
      height: 200vh;
      width: 100vw;
      transform: translateY(0);
      transition: transform 200ms cubic-bezier(0.9, 0, 0.1, 1);
      display: flex;
      flex-direction: column;
    }

    .scroll-container.scrolled {
      transform: translateY(-100vh);
      transition: transform 1500ms cubic-bezier(0.9, 0, 0.1, 1);
    }

    section {
      height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .section-1, .section-2 {
      background-color: #000;
    }

    .reveal-text {
      position: relative;
      font-weight: 900;
      font-size: 8rem;
      color: #fff;
      display: flex;
      margin: 0;
      padding: 50px;
      cursor: pointer;
    }

    .letter {
      position: relative;
      display: block;
      overflow: hidden;
      z-index: 1;
    }

    .letter > span {
      display: block;
      transform: translateY(100%);
      transition-property: transform;
      transition-duration: 1s;
      transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
    }

    .reveal-text.slide-in .letter > span {
      transform: translateY(0);
    }

    .letter:nth-child(1) > span { transition-delay: 0ms; }
    .letter:nth-child(2) > span { transition-delay: 100ms; }
    .letter:nth-child(3) > span { transition-delay: 200ms; }
    .letter:nth-child(4) > span { transition-delay: 300ms; }
    .letter:nth-child(5) > span { transition-delay: 400ms; }
    .letter:nth-child(6) > span { transition-delay: 500ms; }
    .letter:nth-child(7) > span { transition-delay: 600ms; }

    .reveal-text.ready .letter {
      overflow: visible;
    }

    .reveal-text.ready .letter > span {
      transition: transform 600ms cubic-bezier(0.9, 0, 0.1, 1) !important;
      transition-delay: 0ms !important;
      transform-origin: center;
    }

    .reveal-text.resetting .letter {
      overflow: hidden !important;
    }
    .reveal-text.resetting .letter > span {
      transition: none !important;
      transform: translateY(100%) !important;
    }

    /* ── Arrow overlay: sits on top of ALL letters ──
       Covers the same area as the center letter (N).
       overflow:hidden clips the arrow to the square bounds. */
    .arrow-overlay {
      position: absolute;
      /* Center over the 4th letter: 3 letters + half a letter from left edge of text,
         plus the 50px padding. At 8rem ~128px per character, rough center = 3.5ch.
         Using a more robust approach: center of the flex container */
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 1em;       /* ~1 character width at 8rem */
      height: 1.15em;   /* line-height of the text */
      overflow: hidden;
      z-index: 100;
      pointer-events: none;
    }

    /* Slides the arrow in from above the clipped area */
    .arrow-slider {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: translateY(-110%);
    }

    /* Arrow SVG centered in the overlay */
    .arrow-svg-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
    }

    .arrow-svg-wrap svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Gentle float: stays within the clipped bounds */
    @keyframes floatBob {
      0%, 100% { transform: translate(-50%, -56%); }
      50%      { transform: translate(-50%, -44%); }
    }

    .arrow-svg-wrap.floating {
      animation: floatBob 2.2s ease-in-out infinite;
    }

    /* Reset state */
    .reveal-text.resetting .arrow-slider {
      transition: none !important;
      transform: translateY(-110%) !important;
    }
    .reveal-text.resetting .arrow-svg-wrap {
      animation: none !important;
    }

    /* HOVER: letters converge */
    .reveal-text.ready:hover .letter:nth-child(1) > span { transform: translateX(2.2em); }
    .reveal-text.ready:hover .letter:nth-child(2) > span { transform: translateX(1.5em); }
    .reveal-text.ready:hover .letter:nth-child(3) > span { transform: translateX(0.7em); }
    .reveal-text.ready:hover .letter:nth-child(4) > span { transform: translateX(0); }
    .reveal-text.ready:hover .letter:nth-child(5) > span { transform: translateX(-0.7em) scale(0.8); }
    .reveal-text.ready:hover .letter:nth-child(6) > span { transform: translateX(-1.4em); }
    .reveal-text.ready:hover .letter:nth-child(7) > span { transform: translateX(-1.95em); }
  </style>
</head>
<body>
  <div class="scroll-container" id="scrollContainer">
    <section class="section-1">
      <h1 class="reveal-text">
        <span class="letter"><span>E</span></span>
        <span class="letter"><span>M</span></span>
        <span class="letter"><span>A</span></span>
        <span class="letter"><span>N</span></span>
        <span class="letter"><span>U</span></span>
        <span class="letter"><span>E</span></span>
        <span class="letter"><span>L</span></span>

        <!-- Arrow: separate overlay on top of everything -->
        <div class="arrow-overlay">
          <div class="arrow-slider">
            <div class="arrow-svg-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 16 18 9"></polyline>
              </svg>
            </div>
          </div>
        </div>
      </h1>
    </section>
    <section class="section-2"></section>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var text = document.querySelector(".reveal-text");
      var scrollContainer = document.getElementById("scrollContainer");
      var arrowSlider = document.querySelector(".arrow-slider");
      var arrowSvgWrap = document.querySelector(".arrow-svg-wrap");

      var hoverActive = false;
      var arrowEnterTimer = null;
      var floatTimer = null;

      // Letter centering animation is 600ms.
      // Arrow enters 300ms before it ends = 300ms after hover starts.
      var ARROW_DELAY = 300;

      // ── Show arrow: slide in from top, then float ──
      function showArrow() {
        arrowSlider.style.transition = "transform 1200ms cubic-bezier(0.16, 1, 0.3, 1)";
        arrowSlider.style.transform = "translateY(0)";

        // Start floating once the entry is mostly done
        clearTimeout(floatTimer);
        floatTimer = setTimeout(function() {
          if (hoverActive) {
            arrowSvgWrap.classList.add("floating");
          }
        }, 800);
      }

      // ── Hide arrow: slide back up, stop floating ──
      function hideArrow() {
        clearTimeout(arrowEnterTimer);
        clearTimeout(floatTimer);
        arrowSvgWrap.classList.remove("floating");
        arrowSlider.style.transition = "transform 500ms cubic-bezier(0.9, 0, 0.1, 1)";
        arrowSlider.style.transform = "translateY(-110%)";
      }

      // ── Hover events ──
      text.addEventListener("mouseenter", function() {
        if (!text.classList.contains("ready")) return;
        hoverActive = true;

        // Arrow enters 300ms before the 600ms letter animation ends
        clearTimeout(arrowEnterTimer);
        arrowEnterTimer = setTimeout(function() {
          if (hoverActive) showArrow();
        }, ARROW_DELAY);
      });

      text.addEventListener("mouseleave", function() {
        hoverActive = false;
        hideArrow();
      });

      // ── Intro animation ──
      function playIntro(delayBeforeStart) {
        delayBeforeStart = delayBeforeStart || 500;
        text.classList.add("resetting");
        text.classList.remove("slide-in", "ready");

        void text.offsetWidth;
        text.classList.remove("resetting");

        setTimeout(function() {
          text.classList.add("slide-in");
          setTimeout(function() {
            text.classList.add("ready");
          }, 1600);
        }, delayBeforeStart);
      }

      playIntro();

      // ── Scroll ──
      var hasScrolled = false;
      var resetTimeout;

      function handleScrollDown() {
        if (!hasScrolled) {
          hasScrolled = true;
          hoverActive = false;
          hideArrow();
          scrollContainer.classList.add("scrolled");

          resetTimeout = setTimeout(function() {
            if (hasScrolled) {
              text.classList.add("resetting");
              text.classList.remove("slide-in", "ready");
            }
          }, 1500);
        }
      }

      function handleScrollUp() {
        if (hasScrolled) {
          hasScrolled = false;
          scrollContainer.classList.remove("scrolled");
          clearTimeout(resetTimeout);

          text.classList.add("resetting");
          text.classList.remove("slide-in", "ready");
          void text.offsetWidth;

          setTimeout(function() {
            playIntro(300);
          }, 200);
        }
      }

      window.addEventListener("wheel", function(e) {
        if (e.deltaY > 0) handleScrollDown();
        else if (e.deltaY < 0) handleScrollUp();
      });

      var touchStartY = 0;
      window.addEventListener("touchstart", function(e) {
        touchStartY = e.touches[0].clientY;
      });
      window.addEventListener("touchmove", function(e) {
        var touchEndY = e.touches[0].clientY;
        if (touchStartY - touchEndY > 50) handleScrollDown();
        else if (touchEndY - touchStartY > 50) handleScrollUp();
      });
    });
  </script>
</body>
</html>
