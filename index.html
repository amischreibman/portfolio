<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title Animation</title>
  <link rel="stylesheet" href="https://use.typekit.net/hvi2thr.css">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: "greycliff-cf", sans-serif;
    }

    .scroll-container {
      height: 200vh;
      width: 100vw;
      transform: translateY(0);
      transition: transform 200ms cubic-bezier(0.9, 0, 0.1, 1);
      display: flex;
      flex-direction: column;
    }

    .scroll-container.scrolled {
      transform: translateY(-100vh);
      transition: transform 1500ms cubic-bezier(0.9, 0, 0.1, 1);
    }

    section {
      height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .section-1, .section-2 {
      background-color: #000;
    }

    .reveal-text {
      position: relative;
      font-weight: 900;
      font-size: 8rem;
      color: #fff;
      display: flex;
      margin: 0;
      padding: 50px;
      cursor: pointer;
    }

    .letter {
      position: relative;
      display: block;
      overflow: hidden;
      z-index: 1;
    }

    .letter > span {
      display: block;
      transform: translateY(100%);
      transition-property: transform;
      transition-duration: 1s;
      transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
    }

    .reveal-text.slide-in .letter > span {
      transform: translateY(0);
    }

    .letter:nth-child(1) > span { transition-delay: 0ms; }
    .letter:nth-child(2) > span { transition-delay: 100ms; }
    .letter:nth-child(3) > span { transition-delay: 200ms; }
    .letter:nth-child(4) > span { transition-delay: 300ms; }
    .letter:nth-child(5) > span { transition-delay: 400ms; }
    .letter:nth-child(6) > span { transition-delay: 500ms; }
    .letter:nth-child(7) > span { transition-delay: 600ms; }

    .reveal-text.ready .letter {
      overflow: visible;
    }

    .reveal-text.ready .letter > span {
      transition: transform 600ms cubic-bezier(0.9, 0, 0.1, 1) !important;
      transition-delay: 0ms !important;
      transform-origin: center;
    }

    .reveal-text.resetting .letter {
      overflow: hidden !important;
    }
    .reveal-text.resetting .letter > span {
      transition: none !important;
      transform: translateY(100%) !important;
    }
    .reveal-text.resetting .arrow-enter {
      transition: none !important;
      transform: translateY(-110%) !important;
      opacity: 0 !important;
    }
    .reveal-text.resetting .arrow-float {
      animation: none !important;
    }

    .center-letter {
      z-index: 10;
    }

    .center-letter > span {
      position: relative;
      display: inline-block;
    }

    .arrow-mask {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
    }

    /* Outer wrapper: slides the entire arrow panel in from above the mask.
       The mask has overflow:hidden, so the arrow is invisible until it
       enters the clipped area. */
    .arrow-enter {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transform: translateY(-110%);
    }

    /* Inner wrapper: holds the SVG centered inside the mask area.
       Runs the float bob continuously so the entry decelerates
       seamlessly into the hovering motion. The bob range is small
       enough to keep the arrow fully inside the rectangle. */
    .arrow-float {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
    }

    /* HOVER EFFECTS */
    .reveal-text.ready:hover .letter:nth-child(1) > span { transform: translateX(2.2em); }
    .reveal-text.ready:hover .letter:nth-child(2) > span { transform: translateX(1.5em); }
    .reveal-text.ready:hover .letter:nth-child(3) > span { transform: translateX(0.7em); }
    .reveal-text.ready:hover .letter:nth-child(4) > span { transform: translateX(0); }
    .reveal-text.ready:hover .letter:nth-child(5) > span { transform: translateX(-0.7em) scale(0.8); }
    .reveal-text.ready:hover .letter:nth-child(6) > span { transform: translateX(-1.4em); }
    .reveal-text.ready:hover .letter:nth-child(7) > span { transform: translateX(-1.95em); }

    /* Entry: slides down from above the mask into view.
       The mask clips everything outside the letter bounds,
       so the arrow appears to slide in from the top edge. */
    .reveal-text.ready:hover .arrow-enter {
      opacity: 1;
      transform: translateY(0);
      transition: transform 1600ms cubic-bezier(0.16, 1, 0.3, 1) 200ms,
                  opacity 300ms ease 200ms;
    }

    /* Float: runs continuously so it blends with the entry.
       Range is constrained (±8% of center) to stay inside the mask. */
    .reveal-text.ready:hover .arrow-float {
      animation: floatBob 2.4s ease-in-out infinite;
    }

    @keyframes floatBob {
      0%, 100% { transform: translate(-50%, -58%); }
      50%      { transform: translate(-50%, -42%); }
    }
  </style>
</head>
<body>
  <div class="scroll-container" id="scrollContainer">
    <section class="section-1">
      <h1 class="reveal-text">
        <span class="letter"><span>E</span></span>
        <span class="letter"><span>M</span></span>
        <span class="letter"><span>A</span></span>
        <span class="letter center-letter">
          <span>
            N
            <div class="arrow-mask">
              <div class="arrow-enter">
                <div class="arrow-float">
                  <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 16 18 9"></polyline>
                  </svg>
                </div>
              </div>
            </div>
          </span>
        </span>
        <span class="letter"><span>U</span></span>
        <span class="letter"><span>E</span></span>
        <span class="letter"><span>L</span></span>
      </h1>
    </section>
    <section class="section-2"></section>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const text = document.querySelector(".reveal-text");
      const scrollContainer = document.getElementById("scrollContainer");

      function playIntro(delayBeforeStart) {
        delayBeforeStart = delayBeforeStart || 500;
        text.classList.add("resetting");
        text.classList.remove("slide-in", "ready");

        void text.offsetWidth;
        text.classList.remove("resetting");

        setTimeout(function() {
          text.classList.add("slide-in");
          setTimeout(function() {
            text.classList.add("ready");
          }, 1600);
        }, delayBeforeStart);
      }

      playIntro();

      var hasScrolled = false;
      var resetTimeout;

      function handleScrollDown() {
        if (!hasScrolled) {
          hasScrolled = true;
          scrollContainer.classList.add("scrolled");

          resetTimeout = setTimeout(function() {
            if (hasScrolled) {
              text.classList.add("resetting");
              text.classList.remove("slide-in", "ready");
            }
          }, 1500);
        }
      }

      function handleScrollUp() {
        if (hasScrolled) {
          hasScrolled = false;
          scrollContainer.classList.remove("scrolled");
          clearTimeout(resetTimeout);

          text.classList.add("resetting");
          text.classList.remove("slide-in", "ready");
          void text.offsetWidth;

          setTimeout(function() {
            playIntro(300);
          }, 200);
        }
      }

      window.addEventListener("wheel", function(e) {
        if (e.deltaY > 0) handleScrollDown();
        else if (e.deltaY < 0) handleScrollUp();
      });

      var touchStartY = 0;
      window.addEventListener("touchstart", function(e) {
        touchStartY = e.touches[0].clientY;
      });
      window.addEventListener("touchmove", function(e) {
        var touchEndY = e.touches[0].clientY;
        if (touchStartY - touchEndY > 50) handleScrollDown();
        else if (touchEndY - touchStartY > 50) handleScrollUp();
      });
    });
  </script>
</body>
</html>
