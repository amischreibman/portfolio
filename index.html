<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title Animation</title>
  <link rel="stylesheet" href="https://use.typekit.net/hvi2thr.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      overflow: hidden;
    }

    body {
      margin: 0;
      background-color: #000;
    }

    .page-wrapper {
      height: 200vh;
      transform: translateY(0);
      transition: transform 1500ms cubic-bezier(0.85, 0, 0.15, 1);
    }

    .page-wrapper.scrolled {
      transform: translateY(-100vh);
    }

    /* ── Section 1: Title ── */
    .section-one {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* ── Section 2: Black screen ── */
    .section-two {
      height: 100vh;
      background-color: #000;
    }

    /* ── Hover container ── */
    .hover-zone {
      position: relative;
      cursor: default;
    }

    /* ── Reveal text ── */
    .reveal-text {
      font-family: "greycliff-cf", sans-serif;
      font-weight: 900;
      font-size: 8rem;
      color: #fff;
      display: flex;
      margin: 0;
      position: relative;
      z-index: 2;
    }

    .letter {
      display: block;
      overflow: hidden;
      position: relative;
    }

    .letter > span {
      display: block;
      transform: translateY(100%);
      transition: transform 1s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .reveal-text.slide-in .letter > span {
      transform: translateY(0);
    }

    .letter:nth-child(1) > span { transition-delay: 0ms; }
    .letter:nth-child(2) > span { transition-delay: 100ms; }
    .letter:nth-child(3) > span { transition-delay: 200ms; }
    .letter:nth-child(4) > span { transition-delay: 300ms; }
    .letter:nth-child(5) > span { transition-delay: 400ms; }
    .letter:nth-child(6) > span { transition-delay: 500ms; }
    .letter:nth-child(7) > span { transition-delay: 600ms; }

    /* ── White square that solidifies behind converging letters ── */
    .square-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.3);
      background: #fff;
      border-radius: 6px;
      opacity: 0;
      z-index: 1;
      transition: transform 1500ms cubic-bezier(0.85, 0, 0.15, 1),
                  opacity 1500ms cubic-bezier(0.85, 0, 0.15, 1);
    }

    /* ── Arrow icon (dark, inside the square) ── */
    .arrow-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      opacity: 0;
      transition: opacity 500ms cubic-bezier(0.85, 0, 0.15, 1);
      pointer-events: none;
    }

    .arrow-icon svg {
      display: block;
    }

    /* ── Floating bounce with max ease-in-out ── */
    @keyframes bounce-float {
      0%   { transform: translate(-50%, -50%) translateY(-6px); }
      50%  { transform: translate(-50%, -50%) translateY(6px); }
      100% { transform: translate(-50%, -50%) translateY(-6px); }
    }

    .arrow-icon.floating {
      animation: bounce-float 1.8s cubic-bezier(0.85, 0, 0.15, 1) infinite;
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <section class="section-one">
      <div class="hover-zone">
        <h1 class="reveal-text">
          <span class="letter"><span>E</span></span>
          <span class="letter"><span>M</span></span>
          <span class="letter"><span>A</span></span>
          <span class="letter"><span>N</span></span>
          <span class="letter"><span>U</span></span>
          <span class="letter"><span>E</span></span>
          <span class="letter"><span>L</span></span>
        </h1>
        <div class="square-bg"></div>
        <div class="arrow-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5 L12 17" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M6 13 L12 19 L18 13" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </section>

    <section class="section-two"></section>
  </div>

  <script>
    (function() {
      var hoverZone = document.querySelector(".hover-zone");
      var revealText = document.querySelector(".reveal-text");
      var letterWrappers = document.querySelectorAll(".letter");
      var letterSpans = document.querySelectorAll(".letter > span");
      var squareBg = document.querySelector(".square-bg");
      var arrowIcon = document.querySelector(".arrow-icon");
      var pageWrapper = document.querySelector(".page-wrapper");

      var isMorphed = false;
      var isScrolled = false;
      var arrowTimeout = null;
      var floatTimeout = null;

      // Max ease-in-out curve
      var EASE = "cubic-bezier(0.85, 0, 0.15, 1)";

      // ── Initial slide-in ──
      setTimeout(function() {
        revealText.classList.add("slide-in");
      }, 500);

      // ── Compute how far each letter must translateX to reach the group center ──
      function getCenterOffsets() {
        var rects = Array.from(letterWrappers).map(function(el) {
          return el.getBoundingClientRect();
        });
        var groupLeft = rects[0].left;
        var groupRight = rects[rects.length - 1].right;
        var groupCenterX = (groupLeft + groupRight) / 2;

        return rects.map(function(rect) {
          var elCenterX = rect.left + rect.width / 2;
          return groupCenterX - elCenterX;
        });
      }

      // ── Morph: letters converge to center → overlap into white square → arrow appears ──
      function morphToSquare() {
        if (isMorphed) return;
        isMorphed = true;

        var offsets = getCenterOffsets();

        // Measure the text height to size the square
        var textRect = revealText.getBoundingClientRect();
        var squareSize = textRect.height * 1.15;

        // Set square dimensions (it will scale in)
        squareBg.style.width = squareSize + "px";
        squareBg.style.height = squareSize + "px";

        // Allow letters to visibly overlap (remove overflow clipping)
        letterWrappers.forEach(function(el) {
          el.style.overflow = "visible";
        });

        // Phase 1: Letters converge toward center over 1500ms
        // Each letter translates horizontally to the center point and scales up slightly
        // so they overlap and fill space, creating a solid white mass
        letterSpans.forEach(function(span, i) {
          span.style.transition =
            "transform 1500ms " + EASE + ", " +
            "opacity 1500ms " + EASE;
          span.style.transitionDelay = "0ms";
          span.style.transform = "translateX(" + offsets[i] + "px) scaleX(2.5) scaleY(1.1)";
          span.style.opacity = "1";
        });

        // Phase 1b: White square scales up behind the converging letters
        // Starts slightly delayed so the letters lead the motion
        squareBg.style.transition =
          "transform 1500ms " + EASE + ", " +
          "opacity 1000ms " + EASE + " 400ms";
        squareBg.style.transform = "translate(-50%, -50%) scale(1)";
        squareBg.style.opacity = "1";

        // Phase 2: Once square is formed, fade letters out (they're white-on-white now)
        // and reveal the dark arrow
        clearTimeout(arrowTimeout);
        clearTimeout(floatTimeout);

        arrowTimeout = setTimeout(function() {
          if (!isMorphed) return;

          // Hide letters (now behind the square)
          letterSpans.forEach(function(span) {
            span.style.transition = "opacity 300ms " + EASE;
            span.style.opacity = "0";
          });

          // Show arrow
          arrowIcon.style.transition = "opacity 500ms " + EASE;
          arrowIcon.style.opacity = "1";

          floatTimeout = setTimeout(function() {
            if (!isMorphed) return;
            arrowIcon.classList.add("floating");
          }, 400);
        }, 1300);
      }

      // ── Reverse: arrow hides → square shrinks → letters spread back ──
      function morphToText() {
        if (!isMorphed) return;
        isMorphed = false;
        clearTimeout(arrowTimeout);
        clearTimeout(floatTimeout);

        // Stop floating, hide arrow immediately
        arrowIcon.classList.remove("floating");
        arrowIcon.style.transition = "opacity 300ms " + EASE;
        arrowIcon.style.opacity = "0";

        // Shrink square back down
        squareBg.style.transition =
          "transform 1500ms " + EASE + ", " +
          "opacity 800ms " + EASE + " 600ms";
        squareBg.style.transform = "translate(-50%, -50%) scale(0.3)";
        squareBg.style.opacity = "0";

        // Letters spread back to original positions
        letterSpans.forEach(function(span) {
          span.style.transition =
            "transform 1500ms " + EASE + ", " +
            "opacity 400ms " + EASE;
          span.style.transitionDelay = "0ms";
          span.style.transform = "translateY(0) scaleX(1) scaleY(1)";
          span.style.opacity = "1";
        });

        // Restore overflow hidden after animation completes
        setTimeout(function() {
          if (!isMorphed) {
            letterWrappers.forEach(function(el) {
              el.style.overflow = "hidden";
            });
          }
        }, 1600);
      }

      // ── Hover events ──
      hoverZone.addEventListener("mouseenter", function() {
        if (!isScrolled) morphToSquare();
      });

      hoverZone.addEventListener("mouseleave", function() {
        if (!isScrolled) morphToText();
      });

      // ── Scroll to section two ──
      function scrollToSection() {
        if (isScrolled) return;
        isScrolled = true;
        arrowIcon.classList.remove("floating");
        pageWrapper.classList.add("scrolled");
      }

      function scrollToTop() {
        if (!isScrolled) return;
        isScrolled = false;
        pageWrapper.classList.remove("scrolled");
      }

      window.addEventListener("wheel", function(e) {
        if (e.deltaY > 0 && !isScrolled) {
          scrollToSection();
        } else if (e.deltaY < 0 && isScrolled) {
          scrollToTop();
        }
      }, { passive: true });

      // Touch support
      var touchStartY = 0;
      window.addEventListener("touchstart", function(e) {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      window.addEventListener("touchend", function(e) {
        var deltaY = touchStartY - e.changedTouches[0].clientY;
        if (deltaY > 50 && !isScrolled) {
          scrollToSection();
        } else if (deltaY < -50 && isScrolled) {
          scrollToTop();
        }
      }, { passive: true });

      // Keyboard support
      window.addEventListener("keydown", function(e) {
        if ((e.key === "ArrowDown" || e.key === " " || e.key === "PageDown") && !isScrolled) {
          e.preventDefault();
          scrollToSection();
        } else if ((e.key === "ArrowUp" || e.key === "PageUp") && isScrolled) {
          e.preventDefault();
          scrollToTop();
        }
      });
    })();
  </script>
</body>
</html>
