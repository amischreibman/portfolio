<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title Animation</title>
  <link rel="stylesheet" href="https://use.typekit.net/hvi2thr.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      overflow: hidden;
    }

    body {
      margin: 0;
      background-color: #000;
    }

    .page-wrapper {
      height: 200vh;
      transform: translateY(0);
      transition: transform 1500ms cubic-bezier(0.42, 0, 0.58, 1);
    }

    .page-wrapper.scrolled {
      transform: translateY(-100vh);
    }

    /* ── Section 1: Title ── */
    .section-one {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* ── Section 2: Black screen ── */
    .section-two {
      height: 100vh;
      background-color: #000;
    }

    /* ── Hover container ── */
    .hover-zone {
      position: relative;
      cursor: default;
    }

    /* ── Reveal text ── */
    .reveal-text {
      font-family: "greycliff-cf", sans-serif;
      font-weight: 900;
      font-size: 8rem;
      color: #fff;
      display: flex;
      margin: 0;
      position: relative;
      z-index: 2;
    }

    .letter {
      display: block;
      overflow: hidden;
    }

    .letter > span {
      display: block;
      transform: translateY(100%);
      transition: transform 1s cubic-bezier(0.19, 1, 0.22, 1),
                  opacity 1s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .reveal-text.slide-in .letter > span {
      transform: translateY(0);
    }

    .letter:nth-child(1) > span { transition-delay: 0ms; }
    .letter:nth-child(2) > span { transition-delay: 100ms; }
    .letter:nth-child(3) > span { transition-delay: 200ms; }
    .letter:nth-child(4) > span { transition-delay: 300ms; }
    .letter:nth-child(5) > span { transition-delay: 400ms; }
    .letter:nth-child(6) > span { transition-delay: 500ms; }
    .letter:nth-child(7) > span { transition-delay: 600ms; }

    /* ── White rectangle (appears on hover) ── */
    .rect-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: #fff;
      border-radius: 8px;
      transform: translate(-50%, -50%);
      transition: width 1500ms cubic-bezier(0.42, 0, 0.58, 1),
                  height 1500ms cubic-bezier(0.42, 0, 0.58, 1),
                  opacity 1500ms cubic-bezier(0.42, 0, 0.58, 1);
      opacity: 0;
      z-index: 1;
    }

    /* ── Arrow icon (dark, inside the rectangle) ── */
    .arrow-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      opacity: 0;
      transition: opacity 600ms cubic-bezier(0.42, 0, 0.58, 1);
      pointer-events: none;
    }

    .arrow-icon svg {
      display: block;
    }

    /* ── Floating animation ── */
    @keyframes float-arrow {
      0%, 100% { transform: translate(-50%, -50%) translateY(0); }
      50% { transform: translate(-50%, -50%) translateY(10px); }
    }

    .arrow-icon.floating {
      animation: float-arrow 1.6s ease-in-out infinite;
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <section class="section-one">
      <div class="hover-zone">
        <h1 class="reveal-text">
          <span class="letter"><span>E</span></span>
          <span class="letter"><span>M</span></span>
          <span class="letter"><span>A</span></span>
          <span class="letter"><span>N</span></span>
          <span class="letter"><span>U</span></span>
          <span class="letter"><span>E</span></span>
          <span class="letter"><span>L</span></span>
        </h1>
        <div class="rect-bg"></div>
        <div class="arrow-icon">
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 4 L12 18 M5 13 L12 20 L19 13" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </section>

    <section class="section-two"></section>
  </div>

  <script>
    (function() {
      const hoverZone = document.querySelector(".hover-zone");
      const revealText = document.querySelector(".reveal-text");
      const letterEls = document.querySelectorAll(".letter");
      const letterSpans = document.querySelectorAll(".letter > span");
      const rectBg = document.querySelector(".rect-bg");
      const arrowIcon = document.querySelector(".arrow-icon");
      const pageWrapper = document.querySelector(".page-wrapper");

      let isMorphed = false;
      let isScrolled = false;
      let morphTimeout = null;
      let arrowTimeout = null;

      // ── Initial slide-in ──
      setTimeout(function() {
        revealText.classList.add("slide-in");
      }, 500);

      // ── Compute center offsets for each letter ──
      function getCenterOffsets() {
        const rects = Array.from(letterEls).map(el => el.getBoundingClientRect());
        const groupLeft = rects[0].left;
        const groupRight = rects[rects.length - 1].right;
        const groupCenterX = (groupLeft + groupRight) / 2;

        return rects.map(rect => {
          const elCenterX = rect.left + rect.width / 2;
          return groupCenterX - elCenterX;
        });
      }

      // ── Morph: letters collapse to center → white rectangle → dark arrow ──
      function morphToRect() {
        if (isMorphed) return;
        isMorphed = true;

        const offsets = getCenterOffsets();

        // Get the text bounding box for rectangle sizing
        const textRect = revealText.getBoundingClientRect();
        const rectWidth = textRect.height * 1.1;  // square-ish rectangle
        const rectHeight = textRect.height * 1.1;

        // Phase 1: Collapse letters to center and fade them out
        letterSpans.forEach((span, i) => {
          span.style.transition = "transform 1500ms cubic-bezier(0.42, 0, 0.58, 1), opacity 1200ms cubic-bezier(0.42, 0, 0.58, 1)";
          span.style.transitionDelay = "0ms";
          span.style.transform = `translateX(${offsets[i]}px) scale(0.5)`;
          span.style.opacity = "0";
        });

        // Phase 1: Grow the white rectangle
        rectBg.style.transition = "width 1500ms cubic-bezier(0.42, 0, 0.58, 1), height 1500ms cubic-bezier(0.42, 0, 0.58, 1), opacity 800ms cubic-bezier(0.42, 0, 0.58, 1)";
        rectBg.style.width = rectWidth + "px";
        rectBg.style.height = rectHeight + "px";
        rectBg.style.opacity = "1";

        // Phase 2: After rectangle forms, show the dark arrow and start floating
        clearTimeout(arrowTimeout);
        arrowTimeout = setTimeout(function() {
          if (!isMorphed) return;
          arrowIcon.style.transition = "opacity 600ms cubic-bezier(0.42, 0, 0.58, 1)";
          arrowIcon.style.opacity = "1";

          // Start floating after fade-in
          setTimeout(function() {
            if (!isMorphed) return;
            arrowIcon.classList.add("floating");
          }, 300);
        }, 1200);
      }

      // ── Reverse: arrow fades → rectangle shrinks → letters return ──
      function morphToText() {
        if (!isMorphed) return;
        isMorphed = false;
        clearTimeout(arrowTimeout);

        // Immediately stop floating and hide arrow
        arrowIcon.classList.remove("floating");
        arrowIcon.style.transition = "opacity 400ms cubic-bezier(0.42, 0, 0.58, 1)";
        arrowIcon.style.opacity = "0";

        // Shrink rectangle
        rectBg.style.transition = "width 1500ms cubic-bezier(0.42, 0, 0.58, 1), height 1500ms cubic-bezier(0.42, 0, 0.58, 1), opacity 1500ms cubic-bezier(0.42, 0, 0.58, 1)";
        rectBg.style.width = "0";
        rectBg.style.height = "0";
        rectBg.style.opacity = "0";

        // Bring letters back
        letterSpans.forEach((span) => {
          span.style.transition = "transform 1500ms cubic-bezier(0.42, 0, 0.58, 1), opacity 1500ms cubic-bezier(0.42, 0, 0.58, 1) 300ms";
          span.style.transform = "translateY(0)";
          span.style.opacity = "1";
        });
      }

      // ── Hover events on the hover zone ──
      hoverZone.addEventListener("mouseenter", function() {
        if (!isScrolled) morphToRect();
      });

      hoverZone.addEventListener("mouseleave", function() {
        if (!isScrolled) morphToText();
      });

      // ── Scroll to section two ──
      function scrollToSection() {
        if (isScrolled) return;
        isScrolled = true;
        arrowIcon.classList.remove("floating");
        pageWrapper.classList.add("scrolled");
      }

      function scrollToTop() {
        if (!isScrolled) return;
        isScrolled = false;
        pageWrapper.classList.remove("scrolled");
      }

      window.addEventListener("wheel", function(e) {
        if (e.deltaY > 0 && !isScrolled) {
          scrollToSection();
        } else if (e.deltaY < 0 && isScrolled) {
          scrollToTop();
        }
      }, { passive: true });

      // Touch support
      let touchStartY = 0;
      window.addEventListener("touchstart", function(e) {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      window.addEventListener("touchend", function(e) {
        const deltaY = touchStartY - e.changedTouches[0].clientY;
        if (deltaY > 50 && !isScrolled) {
          scrollToSection();
        } else if (deltaY < -50 && isScrolled) {
          scrollToTop();
        }
      }, { passive: true });

      // Keyboard support
      window.addEventListener("keydown", function(e) {
        if ((e.key === "ArrowDown" || e.key === " " || e.key === "PageDown") && !isScrolled) {
          e.preventDefault();
          scrollToSection();
        } else if ((e.key === "ArrowUp" || e.key === "PageUp") && isScrolled) {
          e.preventDefault();
          scrollToTop();
        }
      });
    })();
  </script>
</body>
</html>
